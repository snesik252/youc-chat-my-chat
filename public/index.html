<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Мессенджер</title>
  <style>
    :root {
      --primary: #2f80ed;
      --primary-light: #5b9cf5;
      --bg-chat: #e5e5e5;
      --bg-sidebar: #ffffff;
      --msg-mine: #e3f2fd;
      --msg-other: #ffffff;
      --text: #000000;
      --text-secondary: #707579;
      --shadow: 0 1px 2px rgba(0,0,0,0.1);
      --radius: 16px;
      --input-bg: #f4f4f4;
      --border: #dadada;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #b2b2b2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
      color: var(--text);
      overflow: hidden;
    }

    /* Экран аутентификации */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .auth-container {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 320px;
    }
    .auth-container input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    .auth-container button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .auth-container p {
      text-align: center;
      margin-top: 12px;
      font-size: 0.9rem;
    }
    .auth-container a {
      color: var(--primary);
      cursor: pointer;
    }
    .auth-error {
      color: red;
      text-align: center;
      margin-top: 8px;
    }

    /* Основной интерфейс */
    #app-screen {
      display: none;
      width: 100%;
      max-width: 1000px;
      height: 100vh;
      background: var(--bg-sidebar);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .app {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .search-bar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .search-bar input {
      width: 100%;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #f0f0f0;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .tab-bar {
      display: flex;
      background: #f8f8f8;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border: none;
      background: transparent;
      transition: all 0.15s;
      position: relative;
    }
    .tab-btn.active {
      color: var(--primary);
      font-weight: 600;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
    }
    .panel {
      flex: 1;
      overflow-y: auto;
      display: none;
    }
    .panel.active { display: block; }

    .chat-list-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .chat-list-item:hover { background: #f5f5f5; }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.2rem;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-weight: 500; font-size: 1rem; }
    .chat-last-msg {
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .add-friend-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: 8px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      min-width: 0;
    }
    .chat-header {
      padding: 0 16px;
      height: 56px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
      font-size: 1.1rem;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--primary);
      display: none;
      padding: 0;
      line-height: 1;
    }
    .messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      animation: fadeIn 0.15s;
    }
    .message.mine {
      align-self: flex-end;
      background: var(--msg-mine);
      border-bottom-right-radius: 4px;
    }
    .message.other {
      align-self: flex-start;
      background: var(--msg-other);
      border-bottom-left-radius: 4px;
    }
    .message.pending {
      opacity: 0.6;
    }
    .message .author {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 2px;
      display: block;
    }
    .message .text { display: inline; }
    .message .time {
      font-size: 0.7rem;
      color: var(--text-secondary);
      float: right;
      margin-left: 8px;
      margin-top: 2px;
    }
    .message img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      display: block;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      padding: 10px 16px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 8px;
    }
    .input-area form {
      display: flex;
      flex: 1;
      gap: 8px;
      align-items: center;
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 20px;
      background: #f0f0f0;
      font-size: 1rem;
      outline: none;
    }
    .attach-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
    }
    .attach-btn:hover { background: #e0e0e0; }
    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; max-height: 38vh; }
      .main { flex: 1; }
      .back-btn { display: flex; }
    }
  </style>
</head>
<body>

<!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
<div id="auth-screen">
  <div class="auth-container">
    <div id="login-form">
      <h2>Вход</h2>
      <input type="text" id="login-username" placeholder="Ник" autocomplete="off">
      <input type="password" id="login-password" placeholder="Пароль">
      <button id="login-btn">Войти</button>
      <p>Нет аккаунта? <a id="show-register-link">Регистрация</a></p>
    </div>
    <div id="register-form" style="display:none;">
      <h2>Регистрация</h2>
      <input type="text" id="reg-username" placeholder="Ник" autocomplete="off">
      <input type="password" id="reg-password" placeholder="Пароль">
      <input type="password" id="reg-password2" placeholder="Повтори пароль">
      <button id="register-btn">Зарегистрироваться</button>
      <p>Уже есть аккаунт? <a id="show-login-link">Войти</a></p>
    </div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС (скрыт до входа) -->
<div id="app-screen">
  <div class="app">
    <!-- Сайдбар -->
    <div class="sidebar">
      <div class="search-bar">
        <input type="text" placeholder="Поиск..." id="search-input">
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="chats">💬 Чаты</button>
        <button class="tab-btn" data-tab="contacts">👥 Контакты</button>
        <button class="tab-btn" data-tab="settings">⚙️</button>
      </div>

      <div class="panel active" id="chats-panel">
        <div id="chat-list"></div>
      </div>
      <div class="panel" id="contacts-panel">
        <div style="padding:10px 16px;font-weight:600;color:var(--text-secondary);">Друзья</div>
        <div id="friends-list"></div>
        <div style="padding:10px 16px;font-weight:600;color:var(--text-secondary);">Все пользователи</div>
        <div id="all-users-list"></div>
      </div>
      <div class="panel" id="settings-panel" style="padding:16px;">
        <p>Ник: <strong id="current-nick"></strong></p>
        <button class="add-friend-btn" id="change-nick-btn" style="width:auto;display:block;margin:8px 0;">Сменить ник</button>
        <hr>
        <div style="margin-top:12px;">
          <input type="text" id="group-name-input" placeholder="Название группы">
          <button class="add-friend-btn" id="create-group-btn" style="width:auto;">Создать группу</button>
        </div>
        <div style="margin-top:12px;">
          <p style="font-weight:500;">Добавить друзей в группу:</p>
          <div id="group-members-select"></div>
        </div>
        <hr>
        <button class="add-friend-btn" id="logout-btn" style="background:#ccc;width:auto;margin-top:12px;">Выйти</button>
      </div>
    </div>

    <!-- Чат -->
    <div class="main">
      <div class="chat-header">
        <button class="back-btn" id="back-btn">←</button>
        <span id="header-title">Общий чат</span>
        <span style="flex:1;"></span>
        <button id="call-log-btn" style="background:none;border:none;font-size:1.3rem;cursor:pointer;">📋</button>
      </div>
      <div class="messages" id="messages-container"></div>
      <div class="input-area">
        <input type="file" id="image-input" accept="image/*" style="display:none">
        <button class="attach-btn" id="attach-btn">📎</button>
        <form id="message-form" style="display:flex;flex:1;gap:8px;">
          <input type="text" id="msg-input" placeholder="Сообщение..." autofocus autocomplete="off">
          <button class="send-btn" type="submit">➤</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно смены ника -->
<div id="change-nick-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.2);z-index:1000;">
  <h3>Новый ник</h3>
  <input type="text" id="new-nick-input" placeholder="Новый ник" style="width:100%;margin:8px 0;padding:8px;border:1px solid #dadada;border-radius:8px;">
  <button class="add-friend-btn" id="save-nick-btn">Сохранить</button>
  <button class="add-friend-btn" style="background:#ccc;" onclick="document.getElementById('change-nick-modal').style.display='none'">Отмена</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ================== ПЕРЕМЕННЫЕ ==================
  const socket = io();
  let myName = '';
  let token = localStorage.getItem('authToken');
  let currentChat = { target: 'general', isGroup: false };
  let userFriends = [];
  let userGroups = [];
  let allUsers = [];

  // DOM
  const authScreen = document.getElementById('auth-screen');
  const appScreen = document.getElementById('app-screen');
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const authError = document.getElementById('auth-error');
  const chatListEl = document.getElementById('chat-list');
  const messagesContainer = document.getElementById('messages-container');
  const headerTitle = document.getElementById('header-title');
  const backBtn = document.getElementById('back-btn');

  // ================== АУТЕНТИФИКАЦИЯ ==================
  function showError(msg) { authError.textContent = msg; }

  document.getElementById('show-register-link').addEventListener('click', () => {
    loginForm.style.display = 'none';
    registerForm.style.display = 'block';
    authError.textContent = '';
  });
  document.getElementById('show-login-link').addEventListener('click', () => {
    registerForm.style.display = 'none';
    loginForm.style.display = 'block';
    authError.textContent = '';
  });

  document.getElementById('register-btn').addEventListener('click', async () => {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    if (!username || !password) { showError('Заполните все поля'); return; }
    if (password !== password2) { showError('Пароли не совпадают'); return; }

    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error); return; }

    // Автоматический вход после регистрации
    const loginRes = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const loginData = await loginRes.json();
    if (loginRes.ok) {
      token = loginData.token;
      localStorage.setItem('authToken', token);
      myName = loginData.username;
      socket.emit('register', myName);
      showChat();
    } else {
      showError(loginData.error);
    }
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) { showError('Заполните все поля'); return; }

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error); return; }

    token = data.token;
    localStorage.setItem('authToken', token);
    myName = data.username;
    socket.emit('register', myName);
    showChat();
  });

  // Проверка сессии
  async function checkSession() {
    if (!token) return showAuth();
    try {
      const res = await fetch('/api/me', { headers: { authorization: token } });
      if (!res.ok) { localStorage.removeItem('authToken'); showAuth(); return; }
      const data = await res.json();
      myName = data.username;
      socket.emit('register', myName);
      showChat();
    } catch (e) {
      showAuth();
    }
  }

  function showAuth() {
    authScreen.style.display = 'flex';
    appScreen.style.display = 'none';
  }
  function showChat() {
    authScreen.style.display = 'none';
    appScreen.style.display = 'block';
    renderChatList();
    document.getElementById('current-nick').textContent = myName;
    socket.emit('get-history', { target: 'general', isGroup: false });
  }

  // ================== ВКЛАДКИ ==================
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(tab + '-panel').classList.add('active');
      if (tab === 'contacts') renderContacts();
      if (tab === 'settings') renderSettings();
    });
  });

  // ================== СПИСОК ЧАТОВ ==================
  function renderChatList() {
    chatListEl.innerHTML = '';
    createChatItem('general', '🌐 Общий чат', 'Общий чат');
    createChatItem('ai-bot', '🤖 AI Друг', 'Чат с ИИ');
    userFriends.forEach(f => createChatItem(f, f, 'Личные сообщения'));
    userGroups.forEach(g => createChatItem(g, g, 'Группа', true));
  }

  function createChatItem(target, name, subtitle, isGroup = false) {
    const div = document.createElement('div');
    div.className = 'chat-list-item';
    div.innerHTML = `
      <div class="avatar">${name.charAt(0)}</div>
      <div class="chat-info">
        <div class="chat-name">${name}</div>
        <div class="chat-last-msg">${subtitle}</div>
      </div>
    `;
    div.onclick = () => openChat(target, isGroup);
    chatListEl.appendChild(div);
  }

  function openChat(target, isGroup = false) {
    currentChat = { target, isGroup };
    headerTitle.textContent = target === 'general' ? 'Общий чат' : target;
    backBtn.style.display = (target !== 'general') ? 'flex' : 'none';
    messagesContainer.innerHTML = '';
    socket.emit('get-history', { target, isGroup });
  }

  backBtn.addEventListener('click', () => openChat('general', false));

  // ================== КОНТАКТЫ ==================
  function renderContacts() {
    document.getElementById('friends-list').innerHTML = '';
    userFriends.forEach(friend => {
      const el = document.createElement('div');
      el.className = 'chat-list-item';
      el.innerHTML = `<div class="avatar">${friend.charAt(0)}</div><div class="chat-name">${friend}</div>`;
      el.onclick = () => openChat(friend);
      document.getElementById('friends-list').appendChild(el);
    });

    document.getElementById('all-users-list').innerHTML = '';
    allUsers.forEach(user => {
      if (user.name === myName || user.isAI || userFriends.includes(user.name)) return;
      const el = document.createElement('div');
      el.className = 'chat-list-item';
      el.innerHTML = `<div class="avatar">${user.name.charAt(0)}</div><div class="chat-name">${user.name}</div>`;
      const addBtn = document.createElement('button');
      addBtn.className = 'add-friend-btn';
      addBtn.textContent = 'Добавить';
      addBtn.onclick = (e) => { e.stopPropagation(); socket.emit('add-friend', user.name); };
      el.appendChild(addBtn);
      document.getElementById('all-users-list').appendChild(el);
    });
  }

  // ================== НАСТРОЙКИ ==================
  function renderSettings() {
    document.getElementById('current-nick').textContent = myName;
    document.getElementById('group-members-select').innerHTML = '';
    userFriends.forEach(friend => {
      const label = document.createElement('label');
      label.style.display = 'block';
      label.innerHTML = `<input type="checkbox" value="${friend}"> ${friend}`;
      document.getElementById('group-members-select').appendChild(label);
    });
  }

  document.getElementById('create-group-btn').addEventListener('click', () => {
    const name = document.getElementById('group-name-input').value.trim();
    if (!name) return alert('Введите название группы');
    const checks = document.querySelectorAll('#group-members-select input:checked');
    const members = Array.from(checks).map(cb => cb.value);
    socket.emit('create-group', { name, members });
    document.getElementById('group-name-input').value = '';
  });

  document.getElementById('change-nick-btn').addEventListener('click', () => {
    document.getElementById('change-nick-modal').style.display = 'block';
  });
  document.getElementById('save-nick-btn').addEventListener('click', () => {
    const newNick = document.getElementById('new-nick-input').value.trim();
    if (!newNick) return;
    socket.emit('change-name', newNick);
    document.getElementById('change-nick-modal').style.display = 'none';
    document.getElementById('new-nick-input').value = '';
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('authToken');
    location.reload();
  });

  // ================== ОТПРАВКА СООБЩЕНИЙ ==================
  const messageForm = document.getElementById('message-form');
  const msgInput = document.getElementById('msg-input');
  const imageInput = document.getElementById('image-input');
  const attachBtn = document.getElementById('attach-btn');

  attachBtn.addEventListener('click', () => imageInput.click());

  messageForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    const file = imageInput.files[0];
    if (!text && !file) return;
    if (!currentChat) return;

    const tempMsg = {
      author: myName,
      text: text || '',
      image: null,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      pending: true
    };

    const sendToServer = (extra) => {
      socket.emit('chat message', {
        target: currentChat.target,
        isGroup: currentChat.isGroup,
        ...extra
      });
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = () => {
        tempMsg.image = reader.result;
        appendMessage(tempMsg, true, true);
        sendToServer({ image: reader.result, text });
      };
      reader.readAsDataURL(file);
    } else {
      appendMessage(tempMsg, true, true);
      sendToServer({ text });
    }

    msgInput.value = '';
    imageInput.value = '';
    msgInput.focus();
  });

  // ✅ ИСПРАВЛЕННАЯ ФУНКЦИЯ (убирает серые дубликаты)
  function appendMessage(msg, isMine, isPending = false) {
    // Удаляем все временные сообщения, у которых совпадает автор и текст (или картинка)
    if (!isPending) {
      document.querySelectorAll('.message.pending').forEach(el => {
        const elAuthor = el.querySelector('.author')?.textContent;
        const elText = el.querySelector('.text')?.textContent;
        const elImg = el.querySelector('img');
        if (elAuthor === msg.author &&
            (elText === (msg.text || '') || (elImg && elImg.src === msg.image))) {
          el.remove();
        }
      });
    }

    const div = document.createElement('div');
    div.className = `message ${isMine ? 'mine' : 'other'}${isPending ? ' pending' : ''}`;
    let content = '';
    if (msg.image) content += `<img src="${msg.image}" alt="фото">`;
    if (msg.text) content += `<span class="text">${msg.text}</span>`;
    div.innerHTML = `
      <span class="author">${msg.author}</span>
      ${content}
      <span class="time">${msg.time}</span>
    `;
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // ================== ПРИЁМ СООБЩЕНИЙ ==================
  socket.on('general message', (msg) => {
    if (currentChat.target === 'general') appendMessage(msg, msg.author === myName, false);
  });

  socket.on('private message', (msg) => {
    if (currentChat.target === msg.author) appendMessage(msg, msg.author === myName, false);
  });

  socket.on('group message', (data) => {
    if (currentChat.target === data.group && currentChat.isGroup) {
      appendMessage(data.msg, data.msg.author === myName, false);
    }
  });

  socket.on('chat-history', ({ target, messages, isGroup }) => {
    if (currentChat.target === target && currentChat.isGroup === isGroup) {
      messagesContainer.innerHTML = '';
      messages.forEach(msg => appendMessage(msg, msg.author === myName, false));
    }
  });

  socket.on('user-data', (data) => {
    myName = data.name;
    userFriends = data.friends || [];
    userGroups = data.groups || [];
    document.getElementById('current-nick').textContent = myName;
    renderChatList();
    if (document.getElementById('contacts-panel').classList.contains('active')) renderContacts();
    if (document.getElementById('settings-panel').classList.contains('active')) renderSettings();
  });

  socket.on('users-update', (users) => {
    allUsers = users;
    if (document.getElementById('contacts-panel').classList.contains('active')) renderContacts();
  });

  // Заглушка звонков
  document.getElementById('call-log-btn').addEventListener('click', () => alert('История звонков (можно добавить)'));

  // Старт
  checkSession();
</script>
</body>
</html>
