<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Мессенджер</title>
  <style>
    :root {
      --primary: #2f80ed;
      --primary-light: #5b9cf5;
      --bg-chat: #e5e5e5;
      --bg-sidebar: #fff;
      --msg-mine: #e3f2fd;
      --msg-other: #fff;
      --text: #000;
      --text-secondary: #707579;
      --border: #dadada;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #b2b2b2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #app-screen {
      width: 100%;
      height: 100vh;
      display: none;
      background: #fff;
    }
    .app {
      display: flex;
      height: 100%;
    }
    /* сайдбар, чат, сообщения — как раньше */
    /* ... (код повторно не вставляю для краткости, но ты должен использовать стили из прошлого ответа) */
    /* Добавляем недостающие стили для модалки профиля и кнопок */
    .profile-modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      z-index: 1000;
      width: 320px;
      text-align: center;
    }
    .profile-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--primary);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-bio { color: var(--text-secondary); margin: 8px 0; }
  </style>
</head>
<body>

<!-- Экран аутентификации (как раньше) -->
<div id="auth-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;">
  <!-- ... форма входа/регистрации (скопируй из предыдущего ответа) -->
</div>

<!-- Основной интерфейс -->
<div id="app-screen">
  <div class="app">
    <!-- Сайдбар -->
    <div class="sidebar" style="width:300px;border-right:1px solid var(--border);display:flex;flex-direction:column;">
      <div class="search-bar" style="padding:8px 12px;border-bottom:1px solid var(--border);">
        <input type="text" placeholder="Поиск..." style="width:100%;padding:8px 14px;border:none;border-radius:10px;background:#f0f0f0;"/>
      </div>
      <div class="tab-bar" style="display:flex;background:#f8f8f8;border-bottom:1px solid var(--border);">
        <button class="tab-btn active" data-tab="chats">💬</button>
        <button class="tab-btn" data-tab="contacts">👥</button>
        <button class="tab-btn" data-tab="profile">👤</button>
        <button class="tab-btn" data-tab="settings">⚙️</button>
      </div>

      <div class="panel active" id="chats-panel"><div id="chat-list"></div></div>
      <div class="panel" id="contacts-panel">
        <div style="padding:10px 16px;font-weight:600;">Друзья</div>
        <div id="friends-list"></div>
        <div style="padding:10px 16px;font-weight:600;">Все</div>
        <div id="all-users-list"></div>
      </div>

      <!-- Вкладка Профиль -->
      <div class="panel" id="profile-panel" style="padding:16px;">
        <h3>Мой профиль</h3>
        <div style="text-align:center;margin:16px 0;">
          <div id="my-avatar-preview" class="profile-avatar" style="cursor:pointer;" onclick="document.getElementById('avatar-upload').click()">😊</div>
          <input type="file" id="avatar-upload" accept="image/*" style="display:none">
          <p style="font-size:0.8rem;color:var(--text-secondary);">Нажми на аватар, чтобы изменить</p>
        </div>
        <label>Ник: <strong id="profile-nick"></strong></label>
        <button onclick="openChangeNickModal()" style="margin-left:8px;background:var(--primary);color:white;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;">Сменить</button>
        <div style="margin-top:12px;">
          <label>Описание:</label><br>
          <textarea id="profile-description" rows="3" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;resize:none;"></textarea>
        </div>
        <button onclick="saveProfile()" style="background:var(--primary);color:white;border:none;padding:10px;border-radius:8px;margin-top:8px;width:100%;">Сохранить профиль</button>
      </div>

      <div class="panel" id="settings-panel" style="padding:16px;">
        <p>Ник: <strong id="current-nick"></strong></p>
        <button onclick="openChangeNickModal()">Сменить ник</button>
        <hr>
        <div style="margin-top:12px;">
          <input type="text" id="group-name-input" placeholder="Название группы">
          <button id="create-group-btn">Создать группу</button>
        </div>
        <div id="group-members-select"></div>
        <hr>
        <button id="logout-btn">Выйти</button>
      </div>
    </div>

    <!-- Чат -->
    <div class="main" style="flex:1;display:flex;flex-direction:column;background:var(--bg-chat);">
      <div class="chat-header" style="height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);">
        <button class="back-btn" id="back-btn" style="display:none;">←</button>
        <span id="header-title" style="font-weight:500;font-size:1.1rem;cursor:pointer;" onclick="showUserProfile(currentChat.target)">Общий чат</span>
        <span style="flex:1;"></span>
        <button id="call-log-btn">📋</button>
      </div>
      <div class="messages" id="messages-container" style="flex:1;overflow-y:auto;padding:20px 16px;"></div>
      <div class="input-area" style="padding:10px 16px;background:#fff;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;">
        <input type="file" id="image-input" accept="image/*" style="display:none">
        <button class="attach-btn" id="attach-btn">📎</button>
        <form id="message-form" style="display:flex;flex:1;gap:8px;">
          <input type="text" id="msg-input" placeholder="Сообщение..." style="flex:1;padding:10px 16px;border:none;border-radius:20px;background:#f0f0f0;outline:none;">
          <button type="submit" class="send-btn" style="background:var(--primary);color:white;border:none;border-radius:50%;width:40px;height:40px;">➤</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно профиля пользователя -->
<div class="profile-modal" id="profile-modal">
  <span onclick="document.getElementById('profile-modal').style.display='none'" style="position:absolute;right:16px;top:8px;cursor:pointer;font-size:1.2rem;">✕</span>
  <div class="profile-avatar" id="profile-modal-avatar">A</div>
  <h3 id="profile-modal-name"></h3>
  <p class="profile-bio" id="profile-modal-bio"></p>
  <button id="profile-modal-action" style="background:var(--primary);color:white;border:none;padding:8px 16px;border-radius:8px;margin-top:8px;">Добавить в друзья</button>
</div>

<!-- Модальное окно смены ника (как раньше) -->
<div id="change-nick-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.2);z-index:1000;">
  <h3>Новый ник</h3>
  <input type="text" id="new-nick-input" style="width:100%;margin:8px 0;padding:8px;border:1px solid var(--border);border-radius:8px;">
  <button onclick="saveNewNick()" style="background:var(--primary);color:white;border:none;padding:8px 16px;border-radius:8px;">Сохранить</button>
  <button onclick="document.getElementById('change-nick-modal').style.display='none'" style="background:#ccc;border:none;padding:8px 16px;border-radius:8px;">Отмена</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ... (весь JavaScript, как в предыдущем исправленном ответе, плюс изменения)
  // Ниже привожу только новые/изменённые части. Полный код ты можешь собрать, заменив старый.

  // ===== НОВЫЕ ФУНКЦИИ ПРОФИЛЯ =====
  async function showUserProfile(username) {
    if (username === 'ai-bot') {
      document.getElementById('profile-modal-avatar').innerHTML = '🤖';
      document.getElementById('profile-modal-name').textContent = 'AI Друг';
      document.getElementById('profile-modal-bio').textContent = 'Искусственный интеллект, всегда рад поболтать.';
      document.getElementById('profile-modal-action').style.display = 'none';
      document.getElementById('profile-modal').style.display = 'block';
      return;
    }
    try {
      let res = await fetch('/api/user/' + username);
      if (!res.ok) throw new Error('Не найден');
      let data = await res.json();
      document.getElementById('profile-modal-name').textContent = data.username;
      document.getElementById('profile-modal-bio').textContent = data.description || '';
      let avatarDiv = document.getElementById('profile-modal-avatar');
      if (data.avatar) {
        avatarDiv.innerHTML = `<img src="${data.avatar}" alt="avatar">`;
      } else {
        avatarDiv.innerHTML = data.username.charAt(0).toUpperCase();
      }
      // Кнопка действия: если друг – удалить, иначе добавить
      const btn = document.getElementById('profile-modal-action');
      if (userFriends.includes(username)) {
        btn.textContent = 'Удалить из друзей';
        btn.onclick = () => { socket.emit('remove-friend', username); document.getElementById('profile-modal').style.display = 'none'; };
        btn.style.display = 'inline-block';
      } else {
        btn.textContent = 'Добавить в друзья';
        btn.onclick = () => { socket.emit('add-friend', username); document.getElementById('profile-modal').style.display = 'none'; };
        btn.style.display = 'inline-block';
      }
      document.getElementById('profile-modal').style.display = 'block';
    } catch(e) { alert('Пользователь не найден'); }
  }

  // Сохранение профиля
  async function saveProfile() {
    const description = document.getElementById('profile-description').value;
    const avatarFile = document.getElementById('avatar-upload').files[0];
    let avatarData = null;
    if (avatarFile) {
      avatarData = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(avatarFile);
      });
    }
    const body = { description };
    if (avatarData) body.avatar = avatarData;
    let res = await fetch('/api/update-profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'authorization': token },
      body: JSON.stringify(body)
    });
    let data = await res.json();
    if (res.ok) {
      // Обновить локальный аватар
      const myAvatar = document.getElementById('my-avatar-preview');
      if (data.avatar) {
        myAvatar.innerHTML = `<img src="${data.avatar}" alt="avatar">`;
      } else {
        myAvatar.textContent = myName.charAt(0).toUpperCase();
      }
      alert('Профиль сохранён');
    } else {
      alert(data.error || 'Ошибка');
    }
  }

  // Загрузка своего профиля при открытии вкладки
  async function loadMyProfile() {
    let res = await fetch('/api/me', { headers: { authorization: token } });
    let data = await res.json();
    document.getElementById('profile-nick').textContent = data.username;
    document.getElementById('profile-description').value = data.description || '';
    const preview = document.getElementById('my-avatar-preview');
    if (data.avatar) {
      preview.innerHTML = `<img src="${data.avatar}" alt="avatar">`;
    } else {
      preview.textContent = data.username.charAt(0).toUpperCase();
    }
  }

  // Обработчик переключения на вкладку профиля
  document.querySelector('[data-tab="profile"]').addEventListener('click', loadMyProfile);

  // Клик по нику в шапке чата или в списке
  // Уже привязано: в header-title onclick="showUserProfile(currentChat.target)"
  // В элементах списка: on click вызываем openChat, но можно добавить клик по нику отдельно
  // Я пока оставлю так, ты можешь добавить обработку на своё усмотрение.
</script>
</body>
</html>
