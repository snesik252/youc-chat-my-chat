<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Мессенджер</title>
  <style>
    :root {
      --primary: #2f80ed;
      --primary-light: #5b9cf5;
      --bg-chat: #e5e5e5;
      --bg-sidebar: #ffffff;
      --msg-mine: #e3f2fd;
      --msg-other: #ffffff;
      --text: #000000;
      --text-secondary: #707579;
      --border: #dadada;
      --radius: 16px;
    }
    .dark-theme {
      --bg-chat: #1a1a1a;
      --bg-sidebar: #2c2c2c;
      --msg-mine: #2b5278;
      --msg-other: #3a3a3a;
      --text: #e0e0e0;
      --text-secondary: #aaaaaa;
      --border: #444444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #b2b2b2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .auth-container {
      background: var(--bg-sidebar);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 320px;
    }
    .auth-container input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-chat);
      color: var(--text);
    }
    .auth-container button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .auth-container p { text-align: center; margin-top: 12px; font-size: 0.9rem; color: var(--text-secondary); }
    .auth-container a { color: var(--primary); cursor: pointer; }
    .auth-error { color: red; text-align: center; margin-top: 8px; }

    #app-screen { display: none; width: 100%; height: 100vh; background: var(--bg-sidebar); }
    .app { display: flex; height: 100%; }

    .sidebar {
      width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .search-bar { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .search-bar input {
      width: 100%;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #f0f0f0;
      font-size: 0.95rem;
      outline: none;
      color: var(--text);
    }
    .tab-bar { display: flex; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border: none;
      background: transparent;
      position: relative;
    }
    .tab-btn.active { color: var(--primary); font-weight: 600; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
    }
    .panel { flex: 1; overflow-y: auto; display: none; }
    .panel.active { display: block; }

    .chat-list-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .chat-list-item:hover { background: rgba(0,0,0,0.05); }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.2rem;
      margin-right: 12px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-weight: 500; font-size: 1rem; color: var(--text); }
    .chat-last-msg { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-header {
      height: 56px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--primary);
      display: none;
    }
    .call-btn-header {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.3rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .notif-bell {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      margin-left: auto;
      position: relative;
    }
    .notif-badge {
      position: absolute;
      top: -2px;
      right: -4px;
      background: red;
      color: white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 0.7rem;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      animation: fadeIn 0.15s;
    }
    .message.mine { align-self: flex-end; background: var(--msg-mine); border-bottom-right-radius: 4px; }
    .message.other { align-self: flex-start; background: var(--msg-other); border-bottom-left-radius: 4px; }
    .message.pending { opacity: 0.6; }
    .message .author {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 2px;
      display: inline-block;
      cursor: pointer;
    }
    .message .author:hover { text-decoration: underline; }
    .message .text { display: inline; }
    .message .time { font-size: 0.7rem; color: var(--text-secondary); float: right; margin-left: 8px; margin-top: 2px; }
    .message img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      display: block;
      margin-top: 4px;
      cursor: pointer;
    }

    .photo-preview-bar {
      display: none;
      padding: 8px 16px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 8px;
    }
    .photo-preview-bar img { height: 40px; border-radius: 8px; }
    .photo-preview-bar button { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); }

    .input-area {
      display: flex;
      padding: 10px 16px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 8px;
    }
    .input-area form { display: flex; flex: 1; gap: 8px; align-items: center; }
    .input-area input[type="text"] {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 20px;
      background: #f0f0f0;
      font-size: 1rem;
      outline: none;
      color: var(--text);
    }
    .attach-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; padding: 4px; border-radius: 50%; }
    .attach-btn:hover { background: rgba(0,0,0,0.1); }
    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-sidebar);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      z-index: 1000;
      width: 320px;
      color: var(--text);
    }
    .modal-close { position: absolute; right: 16px; top: 8px; cursor: pointer; font-size: 1.2rem; }
    .profile-avatar-large {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--primary);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      overflow: hidden;
    }
    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }

    .call-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .videos { display: flex; gap: 10px; margin-bottom: 20px; }
    .videos video { width: 150px; height: 200px; background: #000; border-radius: 12px; object-fit: cover; }
    .end-call-btn { background: #ff4757; color: white; border: none; padding: 12px 28px; border-radius: 28px; font-size: 1.1rem; cursor: pointer; }

    .image-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }
    .image-overlay img { max-width: 95%; max-height: 95%; }
    .image-overlay .close-overlay { position: absolute; top: 20px; right: 30px; color: white; font-size: 2rem; cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 700px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; max-height: 38vh; }
      .main { flex: 1; }
      .back-btn { display: flex; }
    }
  </style>
</head>
<body>

<!-- Экраны входа/регистрации, основной интерфейс (как в предыдущем полном HTML) -->
<!-- Вставляем весь HTML из предыдущего ответа (полный index.html) и заменяем только JavaScript ниже -->

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      {
        urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ]
  };

  let myName = '';
  let token = localStorage.getItem('authToken');
  let currentChat = { target: 'general', isGroup: false };
  let userFriends = [], userGroups = [], allUsers = [];
  let notifications = [];
  let localStream = null, peerConnection = null, currentCallPartner = null;
  let currentFriendRequests = [];
  let pendingImageFile = null;

  // Аутентификация (без изменений)
  function showAuth() { document.getElementById('auth-screen').style.display = 'flex'; document.getElementById('app-screen').style.display = 'none'; }
  function showChat() { document.getElementById('auth-screen').style.display = 'none'; document.getElementById('app-screen').style.display = 'block'; }
  function showError(msg) { document.getElementById('auth-error').textContent = msg; }

  document.getElementById('show-register-link').onclick = () => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    showError('');
  };
  document.getElementById('show-login-link').onclick = () => {
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('login-form').style.display = 'block';
    showError('');
  };

  document.getElementById('register-btn').onclick = async () => {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    if (!username || !password) return showError('Заполните все поля');
    if (password !== password2) return showError('Пароли не совпадают');
    let res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    let data = await res.json();
    if (!res.ok) return showError(data.error);
    res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    data = await res.json();
    if (res.ok) {
      token = data.token; localStorage.setItem('authToken', token); myName = data.username;
      socket.emit('register', myName); showChat();
    } else showError(data.error);
  };

  document.getElementById('login-btn').onclick = async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) return showError('Заполните все поля');
    let res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    let data = await res.json();
    if (!res.ok) return showError(data.error);
    token = data.token; localStorage.setItem('authToken', token); myName = data.username;
    socket.emit('register', myName); showChat();
  };

  async function checkSession() {
    if (!token) return showAuth();
    try {
      let res = await fetch('/api/me', { headers: {authorization: token} });
      if (!res.ok) { localStorage.removeItem('authToken'); showAuth(); return; }
      let data = await res.json();
      myName = data.username;
      notifications = data.notifications || [];
      userFriends = data.friends || [];
      updateNotificationBadge();
      socket.emit('register', myName);
      showChat();
    } catch(e) { showAuth(); }
  }

  // Тёмная тема
  const darkThemeToggle = document.getElementById('dark-theme-toggle');
  if (localStorage.getItem('darkTheme') === 'true') {
    document.documentElement.classList.add('dark-theme');
    darkThemeToggle.checked = true;
  }
  darkThemeToggle.onchange = (e) => {
    if (e.target.checked) {
      document.documentElement.classList.add('dark-theme');
      localStorage.setItem('darkTheme', 'true');
    } else {
      document.documentElement.classList.remove('dark-theme');
      localStorage.setItem('darkTheme', 'false');
    }
  };

  // Вкладки
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(tab+'-panel').classList.add('active');
      if (tab === 'contacts') renderContacts();
      if (tab === 'requests') renderFriendRequests();
      if (tab === 'profile') loadMyProfile();
      if (tab === 'settings') renderSettings();
    });
  });

  // Рендер чатов (как раньше)
  function renderChatList() {
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    const addItem = (target, name, subtitle, isGroup=false) => {
      const div = document.createElement('div');
      div.className = 'chat-list-item';
      div.innerHTML = `<div class="avatar">${name.charAt(0)}</div><div class="chat-info"><div class="chat-name">${name}</div><div class="chat-last-msg">${subtitle}</div></div>`;
      div.onclick = () => openChat(target, isGroup);
      list.appendChild(div);
    };
    addItem('general', '🌐 Общий чат', 'Общий чат');
    addItem('ai-bot', '🤖 AI Друг', 'Чат с ИИ');
    userFriends.forEach(f => addItem(f, f, 'Личные сообщения'));
    userGroups.forEach(g => addItem(g, g, 'Группа', true));
  }

  function openChat(target, isGroup=false) {
    currentChat = { target, isGroup };
    document.getElementById('header-title').textContent = target === 'general' ? 'Общий чат' : target;
    document.getElementById('back-btn').style.display = (target !== 'general') ? 'flex' : 'none';
    const callBtn = document.getElementById('header-call-btn');
    if (target !== 'general' && target !== 'ai-bot' && !isGroup && target !== myName) {
      callBtn.style.display = 'flex';
    } else {
      callBtn.style.display = 'none';
    }
    document.getElementById('messages-container').innerHTML = '';
    socket.emit('get-history', { target, isGroup });
  }
  document.getElementById('back-btn').onclick = () => openChat('general', false);

  // Контакты
  function renderContacts() {
    document.getElementById('friends-list').innerHTML = '';
    userFriends.forEach(friend => {
      const el = document.createElement('div');
      el.className = 'chat-list-item';
      el.innerHTML = `<div class="avatar">${friend.charAt(0)}</div><div class="chat-name">${friend}</div>`;
      el.onclick = () => openChat(friend);
      document.getElementById('friends-list').appendChild(el);
    });

    document.getElementById('all-users-list').innerHTML = '';
    allUsers.forEach(user => {
      if (user.name === myName || user.isAI || userFriends.includes(user.name)) return;
      const el = document.createElement('div');
      el.className = 'chat-list-item';
      el.innerHTML = `<div class="avatar">${user.name.charAt(0)}</div><div class="chat-name">${user.name}</div>`;
      const addBtn = document.createElement('button');
      addBtn.className = 'send-btn'; addBtn.style.width='auto'; addBtn.style.padding='0 8px'; addBtn.textContent = 'Заявка';
      addBtn.onclick = (e) => { e.stopPropagation(); sendFriendRequest(user.name); };
      el.appendChild(addBtn);
      document.getElementById('all-users-list').appendChild(el);
    });
  }

  // Запросы друзей
  function renderFriendRequests() {
    fetch('/api/friend-requests', { headers: {authorization: token} })
      .then(res => res.json())
      .then(requests => {
        currentFriendRequests = requests;
        const list = document.getElementById('requests-list');
        list.innerHTML = '';
        if (requests.length === 0) {
          list.innerHTML = '<p style="padding:10px">Нет входящих запросов</p>';
          return;
        }
        requests.forEach(req => {
          const div = document.createElement('div');
          div.className = 'chat-list-item';
          div.innerHTML = `
            <div class="avatar">${req.from.charAt(0)}</div>
            <div class="chat-name">${req.from}</div>
            <button class="send-btn" style="width:auto;padding:0 8px;margin-left:auto;" onclick="respondRequest('${req.id}','accept')">✅</button>
            <button class="send-btn" style="width:auto;padding:0 8px;background:#ff4757;" onclick="respondRequest('${req.id}','reject')">❌</button>
          `;
          list.appendChild(div);
        });
      });
  }

  function sendFriendRequest(to) {
    socket.emit('send-friend-request', to);
    alert('Заявка отправлена');
  }

  function respondRequest(requestId, action) {
    socket.emit('respond-friend-request', { requestId, action });
  }

  // Уведомления
  function updateNotificationBadge() {
    const unread = notifications.filter(n => !n.read).length;
    const badge = document.getElementById('notif-badge');
    if (unread > 0) {
      badge.style.display = 'flex';
      badge.textContent = unread;
    } else {
      badge.style.display = 'none';
    }
  }

  function showNotifications() {
    const list = document.getElementById('notifications-list');
    list.innerHTML = '';
    if (notifications.length === 0) {
      list.innerHTML = '<p>Нет уведомлений</p>';
    } else {
      notifications.slice().reverse().forEach(n => {
        const p = document.createElement('p');
        p.textContent = n.text + ' (' + n.time + ')';
        p.style.margin = '6px 0';
        list.appendChild(p);
      });
    }
    document.getElementById('notifications-modal').style.display = 'block';
    notifications.forEach(n => n.read = true);
    updateNotificationBadge();
  }

  socket.on('new-notification', (notif) => {
    notifications.push(notif);
    updateNotificationBadge();
  });

  // Профиль и остальные функции (без изменений, как в предыдущем ответе)
  // ... (скопируйте из предыдущего полного HTML, там всё актуально)

  // ================== СООБЩЕНИЯ ==================
  // Исправленные обработчики private message и group message
  socket.on('private message', msg => {
    // Показываем, если текущий чат соответствует отправителю или получателю
    if (currentChat && (currentChat.target === msg.target || currentChat.target === msg.author)) {
      appendMessage(msg, msg.author === myName, false);
    }
  });

  socket.on('group message', data => {
    if (currentChat && currentChat.target === data.group && currentChat.isGroup) {
      appendMessage(data.msg, data.msg.author === myName, false);
    }
  });

  socket.on('general message', msg => {
    if (currentChat && currentChat.target === 'general') appendMessage(msg, msg.author === myName, false);
  });

  socket.on('chat-history', ({target, messages, isGroup}) => {
    if (currentChat && currentChat.target === target && currentChat.isGroup === isGroup) {
      document.getElementById('messages-container').innerHTML = '';
      messages.forEach(msg => appendMessage(msg, msg.author === myName, false));
    }
  });

  // Функция отправки сообщения и изображения (исправлена)
  function appendMessage(msg, isMine, isPending = false) {
    if (!isPending) {
      document.querySelectorAll('.message.pending').forEach(el => {
        const elAuthor = el.querySelector('.author')?.textContent;
        const elText = el.querySelector('.text')?.textContent;
        const elImg = el.querySelector('img');
        if (elAuthor === msg.author && (elText === (msg.text||'') || (elImg && elImg.src === msg.image))) el.remove();
      });
    }

    const div = document.createElement('div');
    div.className = `message ${isMine ? 'mine' : 'other'}${isPending ? ' pending' : ''}`;
    let content = '';
    if (msg.image) content += `<img src="${msg.image}" alt="фото" onclick="openImageOverlay('${msg.image}')">`;
    if (msg.text) content += `<span class="text">${msg.text}</span>`;
    div.innerHTML = `<span class="author" data-username="${msg.author}" onclick="openProfileModal('${msg.author}')">${msg.author}</span> ${content} <span class="time">${msg.time}</span>`;
    document.getElementById('messages-container').appendChild(div);
    document.getElementById('messages-container').scrollTop = document.getElementById('messages-container').scrollHeight;
  }

  // ... остальной код (звонки, изображения, профиль) без изменений, возьмите из предыдущего полного ответа.
</script>
</body>
</html>
