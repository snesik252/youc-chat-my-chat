<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Мессенджер</title>
  <style>
    :root {
      --primary: #2f80ed;
      --primary-light: #5b9cf5;
      --bg-chat: #e5e5e5;
      --bg-sidebar: #ffffff;
      --msg-mine: #e3f2fd;
      --msg-other: #ffffff;
      --text: #000000;
      --text-secondary: #707579;
      --border: #dadada;
      --radius: 16px;
    }
    .dark-theme {
      --bg-chat: #1a1a1a;
      --bg-sidebar: #2c2c2c;
      --msg-mine: #2b5278;
      --msg-other: #3a3a3a;
      --text: #e0e0e0;
      --text-secondary: #aaaaaa;
      --border: #444444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #b2b2b2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .auth-container {
      background: var(--bg-sidebar);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 320px;
    }
    .auth-container input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-chat);
      color: var(--text);
    }
    .auth-container button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .auth-container p { text-align: center; margin-top: 12px; font-size: 0.9rem; color: var(--text-secondary); }
    .auth-container a { color: var(--primary); cursor: pointer; }
    .auth-error { color: red; text-align: center; margin-top: 8px; }

    #app-screen { display: none; width: 100%; height: 100vh; background: var(--bg-sidebar); }
    .app { display: flex; height: 100%; }

    .sidebar {
      width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .search-bar { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .search-bar input {
      width: 100%;
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: #f0f0f0;
      font-size: 0.95rem;
      outline: none;
      color: var(--text);
    }
    .tab-bar { display: flex; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-secondary);
      border: none;
      background: transparent;
      position: relative;
      transition: 0.15s;
    }
    .tab-btn.active { color: var(--primary); font-weight: 600; }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
    }
    .panel { flex: 1; overflow-y: auto; display: none; }
    .panel.active { display: block; }

    .chat-list-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .chat-list-item:hover { background: rgba(0,0,0,0.05); }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.2rem;
      margin-right: 12px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-weight: 500; font-size: 1rem; color: var(--text); }
    .chat-last-msg { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-header {
      height: 56px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--primary);
      display: none;
    }
    .call-btn-header {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.3rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .notif-bell {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      margin-left: auto;
      position: relative;
    }
    .notif-badge {
      position: absolute;
      top: -2px;
      right: -4px;
      background: red;
      color: white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 0.7rem;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .messages {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      animation: fadeIn 0.15s;
    }
    .message.mine { align-self: flex-end; background: var(--msg-mine); border-bottom-right-radius: 4px; }
    .message.other { align-self: flex-start; background: var(--msg-other); border-bottom-left-radius: 4px; }
    .message.pending { opacity: 0.6; }
    .message .author {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 2px;
      display: inline-block;
      cursor: pointer;
    }
    .message .author:hover { text-decoration: underline; }
    .message .text { display: inline; }
    .message .time { font-size: 0.7rem; color: var(--text-secondary); float: right; margin-left: 8px; margin-top: 2px; }
    .message img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      display: block;
      margin-top: 4px;
      cursor: pointer;
    }

    .photo-preview-bar {
      display: none;
      padding: 8px 16px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 8px;
    }
    .photo-preview-bar img { height: 40px; border-radius: 8px; }
    .photo-preview-bar button { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); }

    .input-area {
      display: flex;
      padding: 10px 16px;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 8px;
    }
    .input-area form { display: flex; flex: 1; gap: 8px; align-items: center; }
    .input-area input[type="text"] {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 20px;
      background: #f0f0f0;
      font-size: 1rem;
      outline: none;
      color: var(--text);
    }
    .attach-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
    }
    .attach-btn:hover { background: rgba(0,0,0,0.1); }
    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-sidebar);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      z-index: 1000;
      width: 320px;
      color: var(--text);
    }
    .modal-close { position: absolute; right: 16px; top: 8px; cursor: pointer; font-size: 1.2rem; }
    .profile-avatar-large {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--primary);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      overflow: hidden;
    }
    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }

    .call-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .videos { display: flex; gap: 10px; margin-bottom: 20px; }
    .videos video {
      width: 150px; height: 200px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }
    .end-call-btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 28px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .image-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }
    .image-overlay img {
      max-width: 95%;
      max-height: 95%;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .image-overlay img.zoomed {
      max-width: none;
      max-height: none;
      width: auto;
      height: auto;
      position: absolute;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 700px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; max-height: 38vh; }
      .main { flex: 1; }
      .back-btn { display: flex; }
    }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-container">
    <div id="login-form">
      <h2>Вход</h2>
      <input type="text" id="login-username" placeholder="Ник" autocomplete="off">
      <input type="password" id="login-password" placeholder="Пароль">
      <button id="login-btn">Войти</button>
      <p>Нет аккаунта? <a id="show-register-link">Регистрация</a></p>
    </div>
    <div id="register-form" style="display:none;">
      <h2>Регистрация</h2>
      <input type="text" id="reg-username" placeholder="Ник" autocomplete="off">
      <input type="password" id="reg-password" placeholder="Пароль">
      <input type="password" id="reg-password2" placeholder="Повтори пароль">
      <button id="register-btn">Зарегистрироваться</button>
      <p>Уже есть аккаунт? <a id="show-login-link">Войти</a></p>
    </div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="app-screen">
  <div class="app">
    <!-- Сайдбар -->
    <div class="sidebar">
      <div class="search-bar"><input type="text" placeholder="Поиск..." disabled></div>
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="chats">💬</button>
        <button class="tab-btn" data-tab="contacts">👥</button>
        <button class="tab-btn" data-tab="requests">👋</button>
        <button class="tab-btn" data-tab="groups">👪</button>
        <button class="tab-btn" data-tab="profile">👤</button>
        <button class="tab-btn" data-tab="settings">⚙️</button>
      </div>
      <div class="panel active" id="chats-panel"><div id="chat-list"></div></div>
      <div class="panel" id="contacts-panel">
        <div style="padding:10px 16px;font-weight:600;color:var(--text-secondary);">Друзья</div>
        <div id="friends-list"></div>
        <div style="padding:10px 16px;font-weight:600;color:var(--text-secondary);">Все пользователи</div>
        <div id="all-users-list"></div>
      </div>
      <div class="panel" id="requests-panel">
        <div style="padding:10px 16px;font-weight:600;color:var(--text-secondary);">Запросы в друзья</div>
        <div id="requests-list"></div>
      </div>
      <div class="panel" id="groups-panel">
        <div style="padding:10px 16px;font-weight:600;color:var(--text-secondary);">Мои группы</div>
        <div id="my-groups-list"></div>
        <hr>
        <div style="padding:10px 16px;font-weight:600;">Создать группу</div>
        <div style="padding:0 16px;">
          <input type="text" id="group-name-input" placeholder="Название группы" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg-chat); color:var(--text);">
          <div id="group-members-select" style="margin-bottom:8px;"></div>
          <button id="create-group-btn" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; width:100%;">Создать</button>
        </div>
      </div>
      <div class="panel" id="profile-panel" style="padding:16px;">
        <h3>Мой профиль</h3>
        <div style="text-align:center;margin:16px 0;">
          <div id="my-avatar-preview" class="profile-avatar-large" onclick="document.getElementById('avatar-upload').click()">😊</div>
          <input type="file" id="avatar-upload" accept="image/*" style="display:none">
          <p style="font-size:0.8rem;color:var(--text-secondary);">Нажми на аватар, чтобы изменить</p>
        </div>
        <label>Ник: <strong id="profile-nick"></strong></label>
        <button id="change-nick-btn-profile" style="margin-left:8px;background:var(--primary);color:white;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;">Сменить</button>
        <div style="margin-top:12px;"><label>Описание:</label><br>
          <textarea id="profile-description" rows="3" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;resize:none;background:var(--bg-chat);color:var(--text);"></textarea>
        </div>
        <button id="save-profile-btn" style="background:var(--primary);color:white;border:none;padding:10px;border-radius:8px;margin-top:8px;width:100%;">Сохранить</button>
      </div>
      <div class="panel" id="settings-panel" style="padding:16px;">
        <p>Ник: <strong id="current-nick"></strong></p>
        <hr>
        <label style="display:flex;align-items:center;gap:8px;margin-top:8px;">
          Тёмная тема <input type="checkbox" id="dark-theme-toggle">
        </label>
        <hr>
        <button id="logout-btn" style="background:#ccc;border:none;border-radius:6px;padding:6px 12px;margin-top:12px;cursor:pointer;">Выйти</button>
      </div>
    </div>

    <!-- Основной чат -->
    <div class="main">
      <div class="chat-header">
        <button class="back-btn" id="back-btn">←</button>
        <span id="header-title" style="font-weight:500;font-size:1.1rem;cursor:pointer;" onclick="openProfileModal(currentChat.target)">Общий чат</span>
        <button class="call-btn-header" id="header-call-btn" onclick="startCall(currentChat.target)">📞</button>
        <button class="notif-bell" id="notif-bell" onclick="showNotifications()">🔔<span class="notif-badge" id="notif-badge"></span></button>
        <button id="call-log-btn" style="background:none;border:none;font-size:1.3rem;">📋</button>
      </div>
      <div class="photo-preview-bar" id="photo-preview-bar">
        <img id="photo-preview-img" src="" alt="preview">
        <span id="photo-preview-text" style="color:var(--text-secondary);">Фото</span>
        <button onclick="cancelPhotoUpload()">✕</button>
      </div>
      <div class="messages" id="messages-container"></div>
      <div class="input-area">
        <input type="file" id="image-input" accept="image/*" style="display:none">
        <button class="attach-btn" id="attach-btn">📎</button>
        <form id="message-form" style="display:flex;flex:1;gap:8px;">
          <input type="text" id="msg-input" placeholder="Сообщение..." autocomplete="off">
          <button type="submit" class="send-btn">➤</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Модальные окна (профиль, смена ника, звонок, фото, уведомления) – без изменений, опущены для краткости, но они должны быть как в прошлом полном index.html -->
<!-- Скопируйте их из последнего полного варианта, я не могу вставить все из-за лимита длины ответа -->

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const rtcConfig = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      {
        urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ]
  };

  let myName = '';
  let token = localStorage.getItem('authToken');
  let currentChat = { target: 'general', isGroup: false };
  let userFriends = [], userGroups = [], allUsers = [];
  let notifications = [];
  let localStream = null, peerConnection = null, currentCallPartner = null;
  let currentFriendRequests = [];
  let pendingImageFile = null;
  let overlayZoomed = false;

  // ================== АВТОРИЗАЦИЯ С ОТЛАДКОЙ ==================
  function showAuth() { document.getElementById('auth-screen').style.display = 'flex'; document.getElementById('app-screen').style.display = 'none'; }
  function showChat() { document.getElementById('auth-screen').style.display = 'none'; document.getElementById('app-screen').style.display = 'block'; }
  function showError(msg) { document.getElementById('auth-error').textContent = msg; }

  document.getElementById('show-register-link').onclick = () => {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    showError('');
  };
  document.getElementById('show-login-link').onclick = () => {
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('login-form').style.display = 'block';
    showError('');
  };

  document.getElementById('register-btn').onclick = async () => {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value.trim();   // убираем пробелы
    const password2 = document.getElementById('reg-password2').value.trim();
    if (!username || !password) return showError('Заполните все поля');
    if (password !== password2) return showError('Пароли не совпадают');

    console.log('Регистрируем:', username);
    let res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    let data = await res.json();
    console.log('Ответ на регистрацию:', data);
    if (!res.ok) return showError(data.error);

    // Небольшая задержка, чтобы база точно сохранила
    await new Promise(resolve => setTimeout(resolve, 300));

    // Автоматический вход
    console.log('Входим после регистрации...');
    res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    data = await res.json();
    console.log('Ответ на вход:', data);
    if (res.ok) {
      token = data.token; localStorage.setItem('authToken', token); myName = data.username;
      socket.emit('register', myName);
      showChat();
    } else {
      showError(data.error || 'Ошибка входа после регистрации');
    }
  };

  document.getElementById('login-btn').onclick = async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim(); // убираем пробелы
    if (!username || !password) return showError('Заполните все поля');

    console.log('Входим:', username);
    let res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password}) });
    let data = await res.json();
    console.log('Ответ на вход:', data);
    if (!res.ok) return showError(data.error);
    token = data.token; localStorage.setItem('authToken', token); myName = data.username;
    socket.emit('register', myName);
    showChat();
  };

  async function checkSession() {
    if (!token) return showAuth();
    try {
      let res = await fetch('/api/me', { headers: {authorization: token} });
      if (!res.ok) { localStorage.removeItem('authToken'); showAuth(); return; }
      let data = await res.json();
      myName = data.username;
      notifications = data.notifications || [];
      userFriends = data.friends || [];
      updateNotificationBadge();
      socket.emit('register', myName);
      showChat();
    } catch(e) { showAuth(); }
  }

  socket.on('connect', () => {
    if (myName) socket.emit('register', myName);
  });

  // Тёмная тема
  const darkThemeToggle = document.getElementById('dark-theme-toggle');
  if (localStorage.getItem('darkTheme') === 'true') {
    document.documentElement.classList.add('dark-theme');
    darkThemeToggle.checked = true;
  }
  darkThemeToggle.onchange = (e) => {
    if (e.target.checked) {
      document.documentElement.classList.add('dark-theme');
      localStorage.setItem('darkTheme', 'true');
    } else {
      document.documentElement.classList.remove('dark-theme');
      localStorage.setItem('darkTheme', 'false');
    }
  };

  // Остальной JavaScript (вкладки, чаты, группы, запросы, уведомления, звонки, фото)
  // ... (весь остальной код из предыдущего полного рабочего index.html)
  // (Я опускаю его здесь, чтобы не превысить лимит, но он должен быть точно таким же, как в последнем рабочем варианте)
</script>
</body>
</html>
